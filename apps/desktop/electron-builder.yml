appId: com.rsi-agent-pi.desktop
productName: RSI-Agent-PI
copyright: Copyright 2026 RSI-Agent-PI contributors. Based on pi-gui, Copyright 2026 Matthew Lam.
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: runtime/python
    to: runtime/python
  - from: runtime/memloop-py
    to: runtime/memloop-py
  # Bundled pi plugins and safety extensions seeded into ~/.pi/agent on first run.
  - from: ../../vendor
    to: vendor

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  category: Development
  executableName: RSI-Agent-PI
  maintainer: Matthew Lam <minghinmatthew.lam@gmail.com>
  vendor: RSI-Agent-PI
  synopsis: Codex-style desktop app for the pi coding agent
  description: A native desktop interface for pi coding agent sessions, workspaces, and tools.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
  packageName: rsi-agent-pi
  packageCategory: devel
  priority: optional
  afterRemove: resources/linux/after-remove.sh
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libgbm1

win:
  executableName: RSI-Agent-PI
  # rcedit/signtool per-executable editing is off: it downloads winCodeSign per exe
  # and its unzip needs symlink privileges on Windows. No signing cert in this build.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

toolsets:
  appimage: "1.0.2"

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  # Release source for the RSI-Agent-PI fork. Replace the placeholder owner and
  # repository with the real GitHub coordinates before publishing a release.
  owner: Joe-zizhen
  repo: RSI-Agent-PI
